name: Build OpenFusion Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'cmake;3.22.1' \
            'ndk;29.0.14206865'

      - name: Configure local SDK path
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > app/local.properties

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/OpenFusion-Android-Native-Ludashi-4.1-debug.apk
          sha256sum out/OpenFusion-Android-Native-Ludashi-4.1-debug.apk > out/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFusion-Android-Native-Ludashi-4.1-debug
          path: out/*
          if-no-files-found: error
