name: Build & Release OpenFusion Android

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$RUNNER_TEMP/openfusion-release.jks"

      - name: Read launcher version
        shell: bash
        run: |
          VERSION_NAME=$(python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml").read_text()

          match = re.search(
              r'android:versionName="([^"]+)"',
              manifest
          )

          if not match:
              raise SystemExit("Could not determine Android versionName")

          print(match.group(1))
          PY
          )

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_PATH=build/OpenFusion-Android-$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Build signed APK
        shell: bash
        run: |
          python3 build.py \
            --android-jar "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" \
            --build-tools "$ANDROID_SDK_ROOT/build-tools/35.0.1" \
            --keystore "$RUNNER_TEMP/openfusion-release.jks" \
            --output "$APK_PATH"

      - name: Generate checksums
        shell: bash
        run: |
          sha256sum "$APK_PATH" > build/SHA256SUMS.txt

          echo
          echo "Release files:"
          ls -lh "$APK_PATH" build/SHA256SUMS.txt
          echo
          cat build/SHA256SUMS.txt

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFusion-Android-${{ env.VERSION_NAME }}
          path: |
            ${{ env.APK_PATH }}
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA_FLAGS=()

          case "$GITHUB_REF_NAME" in
            *alpha*|*beta*|*rc*)
              EXTRA_FLAGS+=(--prerelease)
              ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            "$APK_PATH" \
            build/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenFusion Android $GITHUB_REF_NAME" \
            --generate-notes \
            "${EXTRA_FLAGS[@]}"
